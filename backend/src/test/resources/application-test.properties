# Used only by the MySQL-backed integration tests (profile "test"). Real credentials come from TEST_DB_* variables.
spring.datasource.url=jdbc:mysql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:3306}/${TEST_DB_NAME:elrics_portal_test}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
app.jwt.secret=test-only-secret-key-that-is-at-least-32-characters-long
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:8000
